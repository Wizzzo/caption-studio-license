# Per-version remote flag file. Keyed by app version (matching the git tag it was built
# from, e.g. v1.0.0). The app looks up its own baked-in version at startup and every
# 10 minutes; a missing key, an explicit "enabled: false", or any fetch/parse failure are
# all treated the same way: disabled (fail closed).
#
# latest_version: the newest production (v*.*.*) release, updated automatically here on
# every v-tag push. Used only for the non-security "an update is available" banner (see
# UPGRADE_MECHANISM.md in the main repo) - never for the kill-switch itself.

latest_version: v1.1.3
v1.1.3:
  enabled: true
